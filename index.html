<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
<button class="menu-btn" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" onclick="toggleSidebar(false)"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">✷</div>
      <div><b>Meu Planner</b><span>Sistema de Estudos</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="nav-item" onclick="toggleTema()"><span class="ic" id="temaIc">◐</span> <span id="temaLbl">Modo escuro</span></button>
      <button class="nav-item" onclick="enableNotifs()"><span class="ic">🔔</span> Ativar avisos de prazo</button>
      <div id="contaBox"></div>
      <button class="sync-badge" id="syncBadge" onclick="mDiagnostico()"></button>
      <button class="nav-item" onclick="mDiagnostico()"><span class="ic">◱</span> Saúde dos dados</button>
      <button class="nav-item" onclick="exportData()"><span class="ic">⭳</span> Exportar dados</button>
      <button class="nav-item" onclick="document.getElementById('importFile').click()"><span class="ic">⭱</span> Importar dados</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="authGate"></div>
<div id="modalRoot"></div>
<div id="timerWidget"></div>
<div class="toast" id="toast"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>

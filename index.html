<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sidebar:#17141b; --sidebar-2:#211d29; --sidebar-hover:#2b2635;
  --bg:#f3f1f7; --card:#ffffff; --card-2:#faf9fc;
  --ink:#1e1b24; --muted:#6d6879; --faint:#9b96a7;
  --line:#e9e6f0;
  --purple:#7c3aed; --purple-2:#8b5cf6; --purple-soft:#efe9fe;
  --rose:#db5c88; --rose-soft:#fbe9f0;
  --green:#1d9e75; --green-soft:#e1f5ee;
  --amber:#ba7517; --amber-soft:#faeeda;
  --red:#e24b4a; --red-soft:#fcebeb;
  --blue:#378add; --blue-soft:#e6f1fb;
  --radius:14px;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
:root[data-tema="escuro"]{
  --bg:#131118; --card:#1c1922; --card-2:#232029;
  --ink:#ece9f2; --muted:#a29caf; --faint:#7a7488;
  --line:#2e2a36;
  --purple-soft:#2c2440; --rose-soft:#3a2230; --green-soft:#16302a;
  --amber-soft:#352713; --red-soft:#3a1f1f; --blue-soft:#122c44;
}
:root[data-tema="escuro"] .sidebar{background:#0e0c12}
:root[data-tema="escuro"] ::-webkit-scrollbar-thumb{background:#3a3546}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d5d1de;border-radius:5px}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:238px;background:var(--sidebar);color:#cfc9da;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;padding:20px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--purple),var(--rose));display:flex;align-items:center;justify-content:center;font-size:19px}
.brand b{font-size:15px;color:#fff;font-weight:600;display:block;line-height:1.1}
.brand span{font-size:11px;color:#8a83a0}
.nav-group{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#6a6480;padding:16px 12px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;color:#cfc9da;width:100%;text-align:left;transition:background .12s}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item.active{background:var(--sidebar-2);color:#fff;font-weight:500}
.nav-item .ic{width:18px;text-align:center;opacity:.85}
.nav-item .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--purple-2)}
.side-foot{margin-top:auto;padding-top:14px}

.main{margin-left:238px;flex:1;min-width:0;padding:30px 40px 60px;max-width:1180px}
.page-title{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1;margin-bottom:6px;position:relative;display:inline-block}
.page-title::after{content:"";position:absolute;left:2px;right:-6px;bottom:-7px;height:3px;background:var(--rose);border-radius:3px;opacity:.85}
.page-sub{color:var(--muted);font-size:14px;margin:16px 0 26px;max-width:560px;line-height:1.55}

.row{display:flex;gap:18px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card h3{font-size:15px;font-weight:600;margin-bottom:2px}
.card .h-sub{font-size:12px;color:var(--faint);margin-bottom:14px}

.btn{background:var(--purple);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--purple-soft);color:var(--purple)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--muted)}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--purple-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill.purple{background:var(--purple-soft);color:var(--purple)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.gray{background:#eeecf2;color:var(--muted)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:linear-gradient(120deg,var(--purple),#9a5cf0);border-radius:var(--radius);padding:22px 26px;color:#fff}
.stat b{font-size:30px;font-weight:600;font-family:var(--serif);display:block;line-height:1}
.stat span{font-size:12px;opacity:.85}
.progress{height:7px;background:rgba(255,255,255,.28);border-radius:6px;margin-top:16px;overflow:hidden}
.progress > i{display:block;height:100%;background:#fff;border-radius:6px}

table{width:100%;border-collapse:collapse}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
.table-wrap table{min-width:560px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
.empty{text-align:center;color:var(--faint);padding:34px;font-size:14px}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.check{width:20px;height:20px;border-radius:50%;border:2px solid #cfc9da;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.check.on{background:var(--purple);border-color:var(--purple);color:#fff;font-size:12px}
.check-sq{width:22px;height:22px;border-radius:7px;border:2px solid #cfc9da;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:.12s;color:transparent}
.check-sq.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.li-body{flex:1;min-width:0}
.li-body .t{font-size:14px;font-weight:500}
.li-body .m{font-size:12px;color:var(--faint);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.done .li-body .t{text-decoration:line-through;color:var(--faint)}
.icon-btn{color:var(--faint);padding:4px 7px;border-radius:6px;font-size:13px}
.icon-btn:hover{background:#f0eef5;color:var(--muted)}

.area-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.area-tab{padding:7px 15px;border-radius:20px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.area-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.bars{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-row .lbl{width:110px;font-size:13px;flex-shrink:0}
.bar-track{flex:1;height:22px;background:#f0eef5;border-radius:7px;overflow:hidden}
.bar-track > i{display:block;height:100%;border-radius:7px;transition:width .5s}
.bar-row .val{width:64px;text-align:right;font-size:13px;font-weight:600;color:var(--muted)}

.cal{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);font-size:11px}
.cal .ch{background:var(--card-2);padding:9px 6px;font-weight:600;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.cal .ch.corner{border-left:none}
.cal .hr{padding:8px 6px;text-align:right;color:var(--faint);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.cal .cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:42px;padding:3px;position:relative}
.cal-ev{border-radius:5px;padding:3px 5px;font-size:10px;font-weight:500;color:#fff;margin-bottom:2px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* Calendário mensal — colunas travadas em minmax(0,1fr) para o texto do evento
   nunca empurrar a largura da coluna (era o que estourava o grid no desktop). */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-top:none;border-radius:var(--radius);overflow:hidden;background:var(--card);width:100%}
.mc-head{background:var(--card-2);padding:9px 4px;font-weight:600;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-size:11px;min-width:0;overflow:hidden}
.mc-head:first-child{border-left:none}
.mc-cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:clamp(78px,9vw,112px);padding:5px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.mc-cell:nth-child(7n+1){border-left:none}
.mc-wk{background:var(--card-2)}
.mc-empty{background:var(--card-2)}
.mc-num{font-size:12px;color:var(--faint);font-weight:600;margin-bottom:2px;flex-shrink:0}
.mc-today .mc-num{background:var(--purple);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mc-click{cursor:pointer;transition:background .12s}
.mc-click:hover{background:var(--purple-soft)}
.cal-ev{border-radius:5px;padding:3px 5px;font-size:10px;font-weight:500;color:#fff;line-height:1.25;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;cursor:pointer;transition:filter .12s}
.cal-ev:hover{filter:brightness(1.08)}
.cal-more{font-size:10px;font-weight:600;color:var(--muted);padding:2px 4px;border-radius:5px;background:var(--card-2);text-align:left}
.cal-more:hover{color:var(--purple)}
.cal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-left:auto}
.cal-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle;margin-right:3px}
.cal-agenda{display:none}
/* Visão de ano — 12 mini-meses */
.cal-switch{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.cal-switch button{padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);transition:.12s}
.cal-switch button.on{background:var(--ink);color:#fff}
.ym-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.ym{border:1px solid var(--line);border-radius:12px;padding:10px 11px 11px;background:var(--card);min-width:0}
.ym-atual{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.ym-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:7px}
.ym-h button{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.ym-h button:hover{color:var(--purple)}
.ym-h small{font-size:10px;font-weight:700;color:var(--purple);background:var(--purple-soft);border-radius:9px;padding:1px 7px}
.ym-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.ym-wd{font-size:8px;color:var(--faint);text-align:center;font-weight:700}
.ym-d{aspect-ratio:1/1;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--muted);cursor:pointer;border:1px solid transparent;transition:.12s}
.ym-d:hover{border-color:var(--purple)}
.ym-d.fds{color:var(--faint)}
.ym-d.has{color:#fff;font-weight:700;border-color:transparent}
.ym-d.hoje{box-shadow:0 0 0 2px var(--purple)}
.ym-d.pad{visibility:hidden;cursor:default}
@media(max-width:420px){ .ym-wrap{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px} }
.cal-ag-day{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.cal-ag-day:last-child{border-bottom:none}
.cal-ag-date{width:44px;flex-shrink:0;text-align:center;line-height:1.1}
.cal-ag-date b{font-size:19px;font-weight:700;display:block}
.cal-ag-date span{font-size:10px;color:var(--faint);text-transform:uppercase;font-weight:600}
.cal-ag-day.hoje .cal-ag-date b{color:var(--purple)}
.cal-ag-evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cal-ag-evs .cal-ev{white-space:normal;font-size:12px;padding:7px 10px;border-radius:8px}
@media(max-width:760px){
  .cal-grid-wrap{display:none}
  .cal-agenda{display:block}
}

.modal-bg{position:fixed;inset:0;background:rgba(20,16,28,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--card);border-radius:18px;padding:26px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal h3{font-family:var(--serif);font-size:24px;font-weight:500;margin-bottom:18px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1;justify-content:center}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s,transform .2s}

.timer-fab{position:fixed;right:24px;bottom:24px;z-index:40;width:56px;height:56px;border-radius:50%;
  background:var(--purple);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(124,58,237,.4);transition:transform .12s}
.timer-fab:hover{transform:scale(1.06)}
.timer-fab-running{width:auto;min-width:56px;padding:0 18px;border-radius:28px;gap:8px;font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.02em;background:var(--rose)}
.timer-fab-paused{width:auto;min-width:56px;padding:0 18px;border-radius:28px;gap:8px;font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.02em;background:var(--amber)}
.timer-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:timerPulse 1.2s infinite ease-in-out}
.timer-dot-paused{animation:none;opacity:.9}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.3}}
.timer-panel{position:fixed;right:24px;bottom:24px;z-index:40;width:270px;max-width:calc(100vw - 32px);
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
  box-shadow:0 12px 32px rgba(20,16,28,.22)}
.timer-panel input,.timer-panel select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);color:var(--ink)}
.timer-clock-big{font-family:var(--serif);font-size:38px;font-weight:600;color:var(--rose);text-align:center;margin:6px 0 4px}
@media(max-width:820px){
  .timer-fab,.timer-panel{right:16px;bottom:16px}
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}


.tag-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.hist-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:var(--purple-soft);color:var(--purple);border-radius:16px;padding:5px 11px;font-size:12px;font-weight:500;transition:filter .12s}
.chip:hover{filter:brightness(.96)}
.st-select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);color:var(--ink);font-size:12px;font-weight:600}
.st-select:focus{outline:none;border-color:var(--purple-2)}
.alert-late{border:1px solid var(--red);background:var(--red-soft)}
/* Hábitos */
.habit-toggle{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s}
.habit-toggle:hover{border-color:var(--purple-2)}
.habit-toggle.auto{cursor:default}
.habit-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.habit-name{flex:1;font-weight:600;font-size:15px;min-width:0}
.habit-name small{display:block;font-weight:500;font-size:11px;color:var(--faint);margin-top:1px}
.habit-mark{width:27px;height:27px;border-radius:50%;border:2px solid #cfc9da;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;transition:.15s}
.hg{display:flex;gap:5px;flex-wrap:wrap}
.hg-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.hg-col .wd{font-size:9px;color:var(--faint);font-weight:600}
.hg-cell{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);cursor:pointer;transition:.12s}
.hg-cell.today{box-shadow:0 0 0 2px var(--purple-soft)}
.hg-cell.on{border-color:transparent;color:#fff}
.hg-cell.ro{cursor:default}
.habit-stat{padding:16px 4px;border-bottom:1px solid var(--line)}
.habit-stat:last-child{border-bottom:none}
.habit-stat .hs-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.habit-stat .hs-metrics{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
#authGate{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;
  background:var(--bg);padding:24px}
.gate-card{max-width:400px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:32px 28px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.14)}
.gate-card h2{font-family:var(--serif);font-size:26px;margin:0 0 10px}
.gate-card p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px}
.gate-msg{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5;min-height:16px}
.gate-msg.erro{color:var(--red)}
.gate-link{margin-top:16px;font-size:12px;color:var(--faint);text-decoration:underline;background:none;cursor:pointer}
.gate-link:hover{color:var(--muted)}
.conta-row{display:flex;align-items:center;gap:9px;padding:8px 10px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:10px;background:var(--card-2)}
.conta-row img,.conta-row i{width:24px;height:24px;border-radius:50%;flex-shrink:0;object-fit:cover}
.conta-row i{background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-style:normal}
.conta-row span{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-badge{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:10px;background:var(--card-2);text-align:left;cursor:pointer;transition:border-color .15s}
.sync-badge:hover{border-color:var(--purple-2)}
.sync-badge .sb-dot{font-size:11px;line-height:1;flex-shrink:0}
.sync-badge .sb-txt{display:flex;flex-direction:column;min-width:0}
.sync-badge .sb-txt b{font-size:12px;font-weight:700;line-height:1.3}
.sync-badge .sb-txt small{font-size:10px;color:var(--faint);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Hábitos — grade de 8 semanas */
.hh{margin:10px 0 4px}
.hh-head,.hh-grid{display:grid;grid-template-columns:repeat(7,22px);gap:3px}

<script>
/* ---------------- Data layer ---------------- */
/* tipo:'estudo' → entra nas horas estudadas, metas, hábito automático e Analytics.
   tipo:'trabalho' → contabilizado em bloco próprio (Carga de trabalho), NUNCA somado
   ao estudo. `conta` continua sendo a flag de estudo lida pelo resto do sistema. */
const AREAS = [
  {id:'unitins', nome:'UNITINS', cor:'#378add', conta:true,  tipo:'estudo'},
  {id:'ingles',  nome:'Inglês',  cor:'#1d9e75', conta:true,  tipo:'estudo'},
  {id:'espanhol',nome:'Espanhol',cor:'#ba7517', conta:true,  tipo:'estudo'},
  {id:'pibiex',  nome:'PIBIEX',  cor:'#7c3aed', conta:true,  tipo:'estudo'},
  {id:'ia',      nome:'IA',      cor:'#db5c88', conta:true,  tipo:'estudo'},
  {id:'tre',     nome:'TRE (trabalho)', cor:'#6d6879', conta:false, tipo:'trabalho'},
];
const areaById = id => AREAS.find(a=>a.id===id) || {nome:'—',cor:'#999',conta:true};

/* ---- Períodos letivos: recorte do Hub UNITINS e da Grade (Analytics/Hábitos usam ano civil) ---- */
const DEFAULT_PERIODOS = [{id:'p_2026_2', nome:'2026.2', ini:'2026-07-11', fim:'2026-12-06'}];
function periodoById(id){return store.periodos.find(p=>p.id===id)||null;}
function periodoDe(iso){return store.periodos.find(p=>iso>=p.ini&&iso<=p.fim)||null;}
function periodoAtivo(){
  return periodoDe(todayISO())
      || [...store.periodos].sort((a,b)=>b.fim.localeCompare(a.fim))[0]
      || null;
}
function periodoLabel(p){return p?`${p.nome} · ${fmtBR(p.ini).slice(0,5)}–${fmtBR(p.fim).slice(0,5)}`:'—';}
function periodoEncerrado(p){return !!(p&&p.fim<todayISO());}

const DEFAULT_GRADE = [
  ['Segunda','07h-08h','unitins','UNITINS'],['Segunda','08h-08h10','ingles','Inglês Busuu'],
  ['Segunda','08h10-08h20','espanhol','Espanhol Busuu'],['Segunda','08h20-08h25','espanhol','Espanhol Drops'],
  ['Segunda','09h-19h','tre','TRE (trabalho)'],['Segunda','20h-21h','pibiex','PIBIEX'],['Segunda','21h-22h','espanhol','Espanhol Kultivi'],
  ['Terça','07h-08h','unitins','UNITINS'],['Terça','08h-08h10','ingles','Inglês Busuu'],
  ['Terça','08h10-08h20','espanhol','Espanhol Busuu'],['Terça','08h20-08h25','espanhol','Espanhol Drops'],
  ['Terça','09h-19h','tre','TRE (trabalho)'],['Terça','20h-21h','ingles','Inglês BBC'],
  ['Terça','21h-22h','espanhol','Espanhol Kultivi + IA'],['Terça','22h-22h10','espanhol','Espanhol Fala'],
  ['Quarta','07h-08h','unitins','UNITINS'],['Quarta','08h-08h10','ingles','Inglês Busuu'],
  ['Quarta','08h10-08h20','espanhol','Espanhol Busuu'],['Quarta','08h20-08h25','espanhol','Espanhol Drops'],
  ['Quarta','09h-19h','tre','TRE (trabalho)'],['Quarta','20h-21h','pibiex','PIBIEX'],
  ['Quarta','21h-22h','ingles','Inglês BBC + IA'],['Quarta','22h-22h10','ingles','Inglês Fala'],
  ['Quinta','07h-08h','unitins','UNITINS'],['Quinta','08h-08h10','ingles','Inglês Busuu'],
  ['Quinta','08h10-08h20','espanhol','Espanhol Busuu'],['Quinta','08h20-08h25','espanhol','Espanhol Drops'],
  ['Quinta','09h-19h','tre','TRE (trabalho)'],['Quinta','20h-21h','pibiex','PIBIEX'],
  ['Quinta','21h-22h','espanhol','Espanhol Áudios'],['Quinta','22h-22h10','espanhol','Espanhol Fala'],
  ['Sexta','07h-08h','unitins','UNITINS'],['Sexta','08h-08h10','ingles','Inglês Busuu'],
  ['Sexta','08h10-08h20','espanhol','Espanhol Busuu'],['Sexta','08h20-08h25','espanhol','Espanhol Drops'],
  ['Sexta','09h-19h','tre','TRE (trabalho)'],['Sexta','20h-21h','pibiex','PIBIEX'],['Sexta','21h-22h','ingles','Inglês Encontro'],
  ['Sábado','08h-10h','ia','IA'],['Sábado','10h30-12h','ingles','Encontro Poliglota'],
  ['Domingo','10h-12h','ia','IA'],
].map((r,i)=>({id:'g'+i,dia:r[0],horario:r[1],area:r[2],atividade:r[3],periodo:DEFAULT_PERIODOS[0].id}));
const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

const DEFAULT_HABITOS = [
  {id:'h_aerobico',   nome:'Aeróbico',   cor:'#378add', icon:'🏃', freq:'semanal', alvo:3},
  {id:'h_musculacao', nome:'Musculação', cor:'#db5c88', icon:'🏋️', freq:'semanal', alvo:3},
  {id:'h_leitura',    nome:'Leitura',    cor:'#ba7517', icon:'📖', freq:'diario'},
  {id:'h_estudo',     nome:'Estudo',     cor:'#7c3aed', icon:'📚', auto:true, freq:'diario', minMin:60,
    excluir:['Inglês Busuu','Espanhol Busuu','Espanhol Drops']}, // microdrills não contam para o limiar
];


// === CONEXÃO FIREBASE ===
const firebaseConfig = {
  apiKey: "AIzaSyDWzXgW5PFOkuZas0QFQFStiGg_fVs_iyA",
  authDomain: "meu-planner-rotina.firebaseapp.com",
  databaseURL: "https://meu-planner-rotina-default-rtdb.firebaseio.com",
  projectId: "meu-planner-rotina",
  storageBucket: "meu-planner-rotina.firebasestorage.app",
  messagingSenderId: "286056248817",
  appId: "1:286056248817:web:2365b794accb1cdc468050",
  measurementId: "G-Y4PQ172L0Y"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// === FIM DA CONEXÃO ===

const store = {
  version: 4,
  logs:[], pendencias:[], materias:[], aulas:[], entregaveis:[], sincronas:[],
  periodos: DEFAULT_PERIODOS.map(p=>({...p})),
  grade: DEFAULT_GRADE.map(g=>({...g})),
  habitos: DEFAULT_HABITOS.map(x=>({...x})),
  habitLog: {}, // { 'YYYY-MM-DD': { habitId: true } } — grava só o que foi feito
  metaSemanal: 20,
  metasArea: {}, 
  tema: 'claro',
};
const SCHEMA_VERSION = 4;
const ROOT = 'meu_planner';       // caminho preservado (mantém seu histórico)
const LS_KEY = 'planner_store_v1';

let authReady = false;            // true quando há sessão anônima
let syncAttached = false;
let lastPushedJSON = '';          // p/ ignorar o eco do nosso próprio write
let pendingRerender = false;      // re-render adiado enquanto um modal está aberto

/* ---- validação de shape (protege contra import/registro corrompido) ---- */
function isPlainObj(o){return o&&typeof o==='object'&&!Array.isArray(o);}
function validateStore(d){
  if(!isPlainObj(d)) return false;
  const arrays=['logs','pendencias','materias','aulas','entregaveis','sincronas','grade','habitos','periodos'];
  for(const k of arrays){ if(k in d && !Array.isArray(d[k])) return false; }
  const objs=['habitLog','metasArea'];
  for(const k of objs){ if(k in d && !isPlainObj(d[k])) return false; }
  if('metaSemanal' in d && typeof d.metaSemanal!=='number' && d.metaSemanal!=null) return false;
  return true;
}
/* ---- normaliza defaults/migrações num só lugar ---- */
function normalizeStore(){
  ['logs','pendencias','materias','aulas','entregaveis','sincronas'].forEach(k=>{ if(!Array.isArray(store[k])) store[k]=[]; });
  if(!Array.isArray(store.periodos)||!store.periodos.length) store.periodos=DEFAULT_PERIODOS.map(p=>({...p}));
  store.periodos.forEach(p=>{ if(!p.id)p.id=uid(); if(!p.nome)p.nome='Período'; });
  store.periodos.sort((a,b)=>String(a.ini).localeCompare(String(b.ini)));
  if(!Array.isArray(store.grade)||!store.grade.length) store.grade=DEFAULT_GRADE.map(g=>({...g}));
  if(!Array.isArray(store.habitos)) store.habitos=DEFAULT_HABITOS.map(x=>({...x}));
  if(!isPlainObj(store.habitLog)) store.habitLog={};
  // vínculo com período letivo (migração: tudo que é órfão vai para o período vigente)
  {const pa=periodoAtivo(), pid=pa?pa.id:'';
   store.grade.forEach(g=>{ if(!g.periodo) g.periodo=pid; });
   store.materias.forEach(m=>{ if(!m.periodo) m.periodo=pid; });}
  if(store.metaSemanal==null) store.metaSemanal=20;
  if(!isPlainObj(store.metasArea)) store.metasArea={};
  if(!store.tema) store.tema='claro';
  // seed único: se o "Estudo" já existe sem exclusões definidas, aplica os microdrills padrão
  const est=Array.isArray(store.habitos)?store.habitos.find(x=>x.id==='h_estudo'):null;
  if(est&&est.auto&&est.excluir===undefined) est.excluir=['Inglês Busuu','Espanhol Busuu','Espanhol Drops'];
  // migração de hábitos: frequência-alvo e limiar do automático
  store.habitos.forEach(hb=>{
    if(!hb.freq) hb.freq='diario';                       // preserva o comportamento anterior
    if(hb.freq==='semanal'&&!hb.alvo) hb.alvo=3;
    if(hb.freq==='dias'&&!Array.isArray(hb.dias)) hb.dias=[1,3,5];
    if(!Array.isArray(hb.dias)) hb.dias=[];
    if(hb.auto&&hb.minMin===undefined) hb.minMin=60;     // sem limiar o auto marca todo dia e não informa nada
    if(!hb.auto) hb.minMin=0;
  });
  invalidateHabitCache();
  // matérias: status automático derivado das aulas, salvo quando travado manualmente
  store.materias.forEach(m=>{
    if(m.statusManual===undefined) m.statusManual=false;
    if(!m.statusManual){ const auto=materiaStatusAuto(m.id); if(auto) m.status=auto; }
  });
  store.version=SCHEMA_VERSION;
}
/* aplica um objeto de dados vindo do Firebase ou do localStorage */
function applyData(d){
  if(!validateStore(d)) return false;
  Object.assign(store, d);
  normalizeStore();
  return true;
}

function mirrorLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function hydrateLocal(){
  try{ const raw=localStorage.getItem(LS_KEY);
    if(raw){ const d=JSON.parse(raw); if(applyData(d)) return true; } }catch(e){}
  return false;
}

/* ---- Estado de sincronização visível ----
   Falha de sync é silenciosa por natureza: o app continua funcionando contra o
   localStorage e o toast some em segundos. Sem indicador permanente, dá para
   passar semanas achando que está sincronizado quando não está. */
const SYNC_ST={estado:'conectando',erro:'',ultimo:0,tick:null};
const SYNC_INFO={
  ok:        {cor:'var(--green)', ic:'●', txt:'sincronizado'},
  salvando:  {cor:'var(--blue)',  ic:'◐', txt:'salvando…'},
  conectando:{cor:'var(--faint)', ic:'○', txt:'conectando…'},
  offline:   {cor:'var(--amber)', ic:'▲', txt:'sem rede'},
  local:     {cor:'var(--amber)', ic:'▲', txt:'só neste aparelho'},
  bloqueado: {cor:'var(--red)',   ic:'■', txt:'acesso negado'},
  erro:      {cor:'var(--red)',   ic:'■', txt:'falha ao salvar'}
};
function setSync(estado,erro){
  SYNC_ST.estado=estado;
  if(erro!==undefined)SYNC_ST.erro=erro||'';
  if(estado==='ok')SYNC_ST.ultimo=Date.now();
  renderSyncBadge();
}
function syncHaQuanto(){
  if(!SYNC_ST.ultimo)return '';
  const s=Math.floor((Date.now()-SYNC_ST.ultimo)/1000);
  if(s<60)return 'agora mesmo';
  if(s<3600)return 'há '+Math.floor(s/60)+'min';
  if(s<86400)return 'há '+Math.floor(s/3600)+'h';
  return 'há '+Math.floor(s/86400)+'d';
}
function renderSyncBadge(){
  const el=document.getElementById('syncBadge'); if(!el)return;
  const i=SYNC_INFO[SYNC_ST.estado]||SYNC_INFO.conectando;
  const det=SYNC_ST.estado==='ok'?syncHaQuanto():(SYNC_ST.erro||'toque para detalhes');
  el.innerHTML=`<span class="sb-dot" style="color:${i.cor}">${i.ic}</span>
    <span class="sb-txt"><b style="color:${i.cor}">${i.txt}</b><small>${h(det)}</small></span>`;
  el.title='Status da sincronização — toque para diagnóstico';
  if(!SYNC_ST.tick)SYNC_ST.tick=setInterval(()=>{if(SYNC_ST.estado==='ok')renderSyncBadge();},30000);
}
if(typeof window!=='undefined'){
  window.addEventListener('online', ()=>{ if(SYNC_ST.estado==='offline')setSync('conectando',''); });
  window.addEventListener('offline',()=>setSync('offline','sem conexão de rede'));
}
function syncErrHandler(err,ctx){
  const code=(err&&(err.code||err.message))||'erro desconhecido';
  console.error(ctx,code);
  if(String(code).includes('permission')){
    setSync('bloqueado','regras do Firebase negando — confira Realtime Database → Regras');
  }else if(typeof navigator!=='undefined'&&navigator.onLine===false){
    setSync('offline','sem conexão de rede');
  }else{
    setSync('erro',String(code));
  }
}

/* save principal: espelha local sempre; escreve no Firebase se autenticado */
function save(){
  normalizeStore();
  mirrorLocal();
  if(authReady){
    lastPushedJSON = JSON.stringify(store);
    setSync('salvando');
    db.ref(ROOT).set(store)
      .then(()=>setSync('ok',''))
      .catch(err=>{ syncErrHandler(err,'save falhou'); toast('Sem conexão — salvo localmente'); });
  }else{
    setSync('local','autenticação indisponível — nada sobe para a nuvem');
  }
}
/* write granular para o toggle de hábito (operação mais frequente) */
function saveHabitDay(iso){
  normalizeStore();
  mirrorLocal();
  if(authReady){
    lastPushedJSON=''; // este write é parcial; não suprimir o eco do sync
    setSync('salvando');
    db.ref(ROOT+'/habitLog/'+iso).set(store.habitLog[iso]||null)
      .then(()=>setSync('ok',''))
      .catch(err=>{ syncErrHandler(err,'saveHabitDay falhou'); toast('Sem conexão — salvo localmente'); });
  }else{
    setSync('local','autenticação indisponível — nada sobe para a nuvem');
  }
}

/* ---- Auth com Google + sincronização ao vivo ----
   Login anônimo foi removido: qualquer pessoa cria uma conta anônima em milissegundos,
   então a regra `auth != null` não protegia nada num repositório público. Com Google
   o UID é estável em todos os aparelhos, e a regra pode ser fixada nele de uma vez. */
let authUser=null;
let modoLocal=false;          // usuário optou por seguir sem sincronizar

function initAuth(){
  firebase.auth().onAuthStateChanged(user=>{
    authUser=user||null;
    if(user){
      authReady=true; modoLocal=false;
      fecharPortao();
      renderConta();
      setSync('conectando','');
      attachSync();
    }else{
      authReady=false;
      try{ db.ref(ROOT).off(); }catch(e){}
      syncAttached=false;
      renderConta();
      setSync('local','você não está autenticado — nada sobe para a nuvem');
      if(!modoLocal) abrirPortao();
    }
  });
  // conclui o fluxo de redirect (usado quando o popup é bloqueado)
  try{ firebase.auth().getRedirectResult().catch(err=>{ if(err&&err.code)loginErro(err); }); }catch(e){}
}
function entrarComGoogle(){
  const prov=new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  setLoginMsg('Abrindo o Google…','');
  firebase.auth().signInWithPopup(prov).catch(err=>{
    const c=err&&err.code;
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'){ setLoginMsg('',''); return; }
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){
      setLoginMsg('Popup bloqueado — redirecionando…','');
      firebase.auth().signInWithRedirect(prov).catch(e=>loginErro(e));
      return;
    }
    loginErro(err);
  });
}
function loginErro(err){
  const c=(err&&err.code)||'', host=(typeof location!=='undefined'?location.hostname:'seu domínio');
  let msg='Falha no login: '+(c||err);
  if(c==='auth/unauthorized-domain')
    msg=`O domínio <b>${h(host)}</b> não está autorizado. Firebase Console → Authentication → Settings → Domínios autorizados → adicione <b>${h(host)}</b>.`;
  else if(c==='auth/operation-not-allowed')
    msg='O provedor Google está desativado. Firebase Console → Authentication → Sign-in method → ative <b>Google</b>.';
  else if(c==='auth/configuration-not-found')
    msg='Authentication não está habilitado neste projeto do Firebase.';
  else if(c==='auth/network-request-failed')
    msg='Sem conexão com o Google. Você pode seguir offline por enquanto.';
  console.error('login:',c,err);
  setLoginMsg(msg,'erro');
}
function sair(){

/* ---------------- Cronômetro ---------------- */
// origStart: momento do 1º "Iniciar" (fixo, usado como data/hora início ao salvar)
// segStart: momento em que o trecho ATUAL em execução começou (null se pausado/parado)
// accumMs: soma dos trechos já concluídos (pausas não entram aqui)
let timerState = {running:false, area:'unitins', atividade:'', origStart:null, segStart:null, accumMs:0};
let timerPanelOpen = false;
let timerIntervalId = null;

function loadTimerState(){
  try{const raw=localStorage.getItem('planner_timer_v1');
    if(raw){const d=JSON.parse(raw); if(d&&typeof d==='object')Object.assign(timerState,d);}
  }catch(e){}
}
function saveTimerState(){
  try{localStorage.setItem('planner_timer_v1',JSON.stringify(timerState));}catch(e){}
}
function fmtHMS(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const hh=Math.floor(s/3600), mm=Math.floor((s%3600)/60), ss=s%60;
  const p=n=>String(n).padStart(2,'0');
  return hh>0?`${p(hh)}:${p(mm)}:${p(ss)}`:`${p(mm)}:${p(ss)}`;
}
function timerElapsedMs(){
  return timerState.accumMs + (timerState.running&&timerState.segStart ? Date.now()-timerState.segStart : 0);
}
function timerEnsureTicking(){
  clearInterval(timerIntervalId);
  if(timerState.running){
    timerIntervalId=setInterval(()=>{
      const el=document.getElementById('timerClock');
      if(el) el.textContent=fmtHMS(timerElapsedMs());
    },1000);
  }
}
function timerOpenPanel(){timerPanelOpen=true;renderTimerWidget();}
function timerClosePanel(){timerPanelOpen=false;renderTimerWidget();}
function timerTogglePanel(){timerPanelOpen=!timerPanelOpen;renderTimerWidget();}
function timerSetArea(v){timerState.area=v;saveTimerState();}
function timerSetAtividade(v){timerState.atividade=v;saveTimerState();}
function timerStart(){
  const areaSel=document.getElementById('tmArea'); const atSel=document.getElementById('tmAtividade');
  if(areaSel)timerState.area=areaSel.value;
  if(atSel)timerState.atividade=atSel.value.trim();
  const now=Date.now();
  timerState.running=true; timerState.origStart=now; timerState.segStart=now; timerState.accumMs=0;
  saveTimerState(); timerEnsureTicking(); renderTimerWidget();
}
function timerPause(){
  if(!timerState.running)return;
  timerState.accumMs=timerElapsedMs(); timerState.running=false; timerState.segStart=null;
  saveTimerState(); timerEnsureTicking(); renderTimerWidget();
}
function timerResume(){
  if(timerState.running||!timerState.origStart)return;
  timerState.segStart=Date.now(); timerState.running=true;
  saveTimerState(); timerEnsureTicking(); renderTimerWidget();
}
function timerDiscard(){
  clearInterval(timerIntervalId);
  timerState={running:false,area:timerState.area,atividade:'',origStart:null,segStart:null,accumMs:0};
  saveTimerState(); timerPanelOpen=false; renderTimerWidget();
  toast('Cronômetro descartado');
}
function timerStop(){
  const elapsed=timerElapsedMs();
  const start=new Date(timerState.origStart);
  const end=new Date(timerState.origStart+elapsed); // ignora o tempo pausado, soma só o tempo ativo
  const pad=n=>String(n).padStart(2,'0');
  const data=start.getFullYear()+'-'+pad(start.getMonth()+1)+'-'+pad(start.getDate());
  const ini=pad(start.getHours())+':'+pad(start.getMinutes());
  const fim=pad(end.getHours())+':'+pad(end.getMinutes());
  const prefill={area:timerState.area,atividade:timerState.atividade,data,ini,fim,origem:'timer'};
  clearInterval(timerIntervalId);
  timerState={running:false,area:prefill.area,atividade:'',origStart:null,segStart:null,accumMs:0};
  saveTimerState(); timerPanelOpen=false; renderTimerWidget();
  mNovaSessao('',null,prefill);
}
function renderTimerWidget(){
  const el=document.getElementById('timerWidget'); if(!el)return;
  const idle = !timerState.origStart;
  const paused = !idle && !timerState.running;
  if(idle){
    if(!timerPanelOpen){
      el.innerHTML=`<button class="timer-fab" onclick="timerOpenPanel()" title="Cronômetro">⏱</button>`;
    }else{
      el.innerHTML=`<div class="timer-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <b style="font-size:14px">⏱ Cronômetro</b>
          <button class="icon-btn" onclick="timerClosePanel()">✕</button>
        </div>
        <div class="field" style="margin-bottom:8px"><label>Área</label>
          <select id="tmArea" onchange="timerSetArea(this.value)">${areaOptions(timerState.area)}</select></div>
        <div class="field" style="margin-bottom:10px"><label>Atividade (opcional)</label>
          <input id="tmAtividade" placeholder="Ex: Aula de Cálculo" value="${h(timerState.atividade)}" oninput="timerSetAtividade(this.value)"></div>
        <button class="btn" style="width:100%;justify-content:center" onclick="timerStart()">▶ Iniciar</button>
      </div>`;
    }
    return;
  }
  const elapsed=fmtHMS(timerElapsedMs());
  if(!timerPanelOpen){
    el.innerHTML=`<button class="timer-fab ${paused?'timer-fab-paused':'timer-fab-running'}" onclick="timerOpenPanel()" title="${paused?'Cronômetro pausado':'Cronômetro rodando'}">
      <span class="timer-dot ${paused?'timer-dot-paused':''}"></span><span id="timerClock">${elapsed}</span></button>`;
  }else{
    el.innerHTML=`<div class="timer-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b style="font-size:14px"><span class="timer-dot ${paused?'timer-dot-paused':''}" style="position:static;display:inline-block;margin-right:6px"></span>${paused?'Cronômetro pausado':'Cronômetro rodando'}</b>
        <button class="icon-btn" onclick="timerClosePanel()">✕</button>
      </div>
      <div class="timer-clock-big" id="timerClock" style="${paused?'color:var(--amber)':''}">${elapsed}</div>
      <div style="font-size:12px;color:var(--faint);margin-bottom:10px">${areaById(timerState.area).nome}${timerState.atividade?' · '+h(timerState.atividade):''}</div>
      <input id="tmAtividade" placeholder="Atividade (opcional)" value="${h(timerState.atividade)}" oninput="timerSetAtividade(this.value)" style="margin-bottom:10px">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        ${paused?`<button class="btn" style="flex:1;justify-content:center" onclick="timerResume()">▶ Continuar</button>`
                :`<button class="btn ghost" style="flex:1;justify-content:center" onclick="timerPause()">⏸ Pausar</button>`}
        <button class="btn line" style="flex:1;justify-content:center" onclick="timerDiscard()">Descartar</button>
      </div>
      <button class="btn" style="width:100%;justify-content:center;background:var(--rose)" onclick="timerStop()">■ Parar e salvar</button>
    </div>`;
  }
}

/* ---------------- Date helpers ---------------- */
function localISO(d=new Date()){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
const todayISO = ()=> localISO(); // data LOCAL (corrige rollover de fuso à noite em UTC-3)
function lastDays(n){const out=[];const d=new Date();for(let i=0;i<n;i++){out.push(localISO(d));d.setDate(d.getDate()-1);}return out.reverse();}
function weekdayLetter(iso){return ['D','S','T','Q','Q','S','S'][new Date(iso+'T12:00').getDay()];}
function weekKey(iso){const d=new Date(iso+'T00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);
  const t=new Date(d.getFullYear(),0,1);const w=Math.ceil(((d-t)/86400000+1)/7);return d.getFullYear()+'-S'+String(w).padStart(2,'0');}
function monthKey(iso){return iso.slice(0,7);}
function fmtBR(iso){if(!iso)return'—';const[y,m,d]=iso.slice(0,10).split('-');return d+'/'+m+'/'+y;}
function durH(ini,fim){if(!ini||!fim)return 0;const a=ini.split(':').map(Number),b=fim.split(':').map(Number);
  let min=(b[0]*60+b[1])-(a[0]*60+a[1]); if(min<0)min+=1440; return Math.round(min/60*100)/100;}
function durMin(ini,fim){if(!ini||!fim)return 0;const a=ini.split(':').map(Number),b=fim.split(':').map(Number);
  let min=(b[0]*60+b[1])-(a[0]*60+a[1]); if(min<0)min+=1440; return min;}
// formata horas decimais (ex: 1.5) como "1h 30min"
function fmtDur(horasDecimais){
  const totalMin=Math.round(horasDecimais*60);
  const hh=Math.floor(totalMin/60), mm=totalMin%60;
  if(hh===0&&mm===0)return '0min';
  if(hh===0)return mm+'min';
  if(mm===0)return hh+'h';
  return hh+'h '+mm+'min';
}

/* ---------------- Study hours (TRE excluded) ---------------- */
function countableLogs(){return store.logs.filter(l=>areaById(l.area).conta);}
/* ---- Trabalho (TRE em casa): agregados paralelos, jamais somados ao estudo ---- */
function workLogs(){return store.logs.filter(l=>!areaById(l.area).conta);}
function workHoursRange(iniISO,fimISO){
  return workLogs().filter(l=>l.data>=iniISO&&l.data<=fimISO).reduce((s,l)=>s+durH(l.ini,l.fim),0);}
function workHoursWeek(wk){wk=wk||weekKey(todayISO());
  return workLogs().filter(l=>weekKey(l.data)===wk).reduce((s,l)=>s+durH(l.ini,l.fim),0);}
function workHoursMonth(mk){mk=mk||monthKey(todayISO());
  return workLogs().filter(l=>monthKey(l.data)===mk).reduce((s,l)=>s+durH(l.ini,l.fim),0);}
function workHoursYear(y){y=String(y||anoAtual());
  return workLogs().filter(l=>String(l.data).startsWith(y)).reduce((s,l)=>s+durH(l.ini,l.fim),0);}
function workHoursOnDay(iso){
  return workLogs().filter(l=>l.data===iso).reduce((s,l)=>s+durH(l.ini,l.fim),0);}
function hoursBy(fn){const m={};countableLogs().forEach(l=>{const k=fn(l);m[k]=(m[k]||0)+durH(l.ini,l.fim);});return m;}
function hoursThisWeek(){const wk=weekKey(todayISO());return countableLogs().filter(l=>weekKey(l.data)===wk).reduce((s,l)=>s+durH(l.ini,l.fim),0);}
function hoursThisWeekByArea(areaId){const wk=weekKey(todayISO());
  return countableLogs().filter(l=>l.area===areaId&&weekKey(l.data)===wk).reduce((s,l)=>s+durH(l.ini,l.fim),0);}
function studyStreak(){
  // dias consecutivos (terminando hoje ou ontem) com ao menos uma sessão que conta
  const dias=new Set(countableLogs().map(l=>l.data));
  if(!dias.size)return 0;
  let streak=0; const d=new Date();
  // se não estudou hoje ainda, começa a contar de ontem para não zerar durante o dia
  if(!dias.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
  while(dias.has(d.toISOString().slice(0,10))){streak++; d.setDate(d.getDate()-1);}
  return streak;
}
function isAtrasado(prazo,done){if(!prazo||done)return false;return prazo<todayISO();}

    const n=parseFloat(el.value); store.metasArea[a.id]=isNaN(n)?0:n;});
  save();closeModal();vDashboard();toast('Metas atualizadas');}

let calMonth = (()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()};})();
const MESES_PT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function calNav(delta){calMonth.m+=delta;if(calMonth.m<0){calMonth.m=11;calMonth.y--;}if(calMonth.m>11){calMonth.m=0;calMonth.y++;}vCalendario();}
function calGo(y,m){calMonth={y:+y,m:+m};vCalendario();}
function calHoje(){const d=new Date();calMonth={y:d.getFullYear(),m:d.getMonth()};vCalendario();}

/* Modelo de evento (dado, não HTML) — a mesma lista alimenta a grade, a agenda
   mobile e o modal do dia. Evita as três representações divergirem. */
function calEventos(){
  const hoje=todayISO(), out={};
  const push=(iso,ev)=>{if(!iso)return;const k=iso.slice(0,10);(out[k]=out[k]||[]).push(ev);};
  store.pendencias.filter(p=>p.prazo&&!p.done).forEach(p=>{
    const late=p.prazo<hoje;
    push(p.prazo,{tipo:'pend',id:p.id,late,cor:late?'var(--red)':p.prio==='Alta'?'var(--red)':p.prio==='Média'?'var(--amber)':'var(--muted)',
      ord:'0',icon:late?'⚠':'○',txt:p.nome,sub:p.prio||'',
      tip:`Pendência: ${p.nome}${late?' (atrasada)':''} — clique para editar`});});
  store.entregaveis.filter(e=>e.prazo&&e.status!=='Entregue').forEach(e=>{
    const late=e.prazo<hoje, mat=materiaNome(e.materia);
    push(e.prazo,{tipo:'entreg',id:e.id,late,cor:late?'var(--red)':'var(--blue)',
      ord:'0',icon:'📌',txt:e.nome,sub:mat&&mat!=='—'?mat:'',
      tip:`Entregável UNITINS — ${mat}: ${e.nome}${late?' (atrasado)':''} — clique para abrir no Hub`});});
  store.sincronas.forEach(s=>{const mat=materiaNome(s.materia);
    push(s.data,{tipo:'sinc',id:s.id,late:false,cor:'var(--purple)',
      ord:s.ini||'99:99',icon:'🎥',txt:s.nome,sub:[s.ini,mat&&mat!=='—'?mat:''].filter(Boolean).join(' · '),
      tip:`Aula síncrona — ${mat}: ${s.nome} ${s.ini||''} — clique para editar`});});
  Object.values(out).forEach(a=>a.sort((x,y)=>x.ord.localeCompare(y.ord)));
  return out;
}
function calEvHTML(ev,compacto){
  const label=compacto
    ? `${ev.icon} ${h(ev.tipo==='sinc'&&ev.ord!=='99:99'?ev.ord+' ':'')}${h(ev.txt)}`
    : `${ev.icon} ${h(ev.txt)}${ev.sub?` <span style="opacity:.82">· ${h(ev.sub)}</span>`:''}`;
  return `<div class="cal-ev" style="background:${ev.cor}" title="${h(ev.tip)}"
    onclick="calAbrir('${ev.tipo}','${ev.id}',event)">${label}</div>`;
}
function calAbrir(tipo,id,ev){
  if(ev){ev.stopPropagation();}
  if(tipo==='pend')return mPendencia(id);
  if(tipo==='sinc')return mSincrona(id);
  if(tipo==='entreg'){window._uniTab='entregaveis';go('unitins');}
}

/* ---- Visão de ano inteiro (12 mini-meses) ----
   O calendário nunca teve limite de data; o que faltava era enxergar o ano de
   uma vez. A lista de anos é derivada dos dados (+3 à frente), então 2027, 2028…
   aparecem sozinhos conforme você lança prazos lá. As setas não têm limite. */
let calVista='mes';
function setCalVista(v){calVista=v;vCalendario();}
function calAnoNav(d){calMonth.y+=d;vCalendario();}
function calAbrirMes(y,m){calMonth={y:+y,m:+m};calVista='mes';vCalendario();}
function anosCalendario(){
  const set=new Set([new Date().getFullYear(),calMonth.y]);
  const add=iso=>{if(iso&&/^\d{4}/.test(iso))set.add(+iso.slice(0,4));};
  store.pendencias.forEach(p=>add(p.prazo));
  store.entregaveis.forEach(e=>add(e.prazo));
  store.sincronas.forEach(s=>add(s.data));
  store.periodos.forEach(p=>{add(p.ini);add(p.fim);});
  const arr=[...set], out=[];
  for(let y=Math.min(...arr)-1;y<=Math.max(...arr)+3;y++)out.push(y);
  return out;
}
function calCorDia(dia){
  if(dia.some(e=>e.late))return 'var(--red)';
  if(dia.some(e=>e.tipo==='entreg'))return 'var(--blue)';
  if(dia.some(e=>e.tipo==='sinc'))return 'var(--purple)';
  return 'var(--muted)';
}
function calAnoHTML(y,evs){
  const hoje=todayISO(), mAtual=new Date().getMonth(), yAtual=new Date().getFullYear();
  let total=0;
  const meses=[];
  for(let m=0;m<12;m++){
    const off=(new Date(y,m,1).getDay()+6)%7, nd=new Date(y,m+1,0).getDate();
    let cells='', cnt=0;
    for(let i=0;i<off;i++)cells+='<div class="ym-d pad"></div>';
    for(let d=1;d<=nd;d++){
      const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dia=evs[iso]||[]; cnt+=dia.length;
      const fds=[5,6].includes((new Date(iso+'T12:00').getDay()+6)%7);
      const tip=dia.length
        ? `${fmtBR(iso)} — ${dia.map(e=>e.txt).join(' · ')}`
        : `${fmtBR(iso)} — clique para criar uma pendência`;
      cells+=`<div class="ym-d ${dia.length?'has':''} ${fds?'fds':''} ${iso===hoje?'hoje':''}"
        style="${dia.length?`background:${calCorDia(dia)}`:''}" title="${h(tip)}"
        onclick="${dia.length?`calDiaModal('${iso}')`:`novaPendenciaNoDia('${iso}')`}">${d}</div>`;
    }
    total+=cnt;
    meses.push(`<div class="ym ${(y===yAtual&&m===mAtual)?'ym-atual':''}">
      <div class="ym-h"><button onclick="calAbrirMes(${y},${m})" title="Abrir ${MESES_PT[m]} em detalhe">${MESES_PT[m]}</button>
        ${cnt?`<small>${cnt}</small>`:''}</div>
      <div class="ym-g">${['S','T','Q','Q','S','S','D'].map(x=>`<div class="ym-wd">${x}</div>`).join('')}</div>
      <div class="ym-g" style="margin-top:2px">${cells}</div>
    </div>`);
  }
  return {html:`<div class="ym-wrap">${meses.join('')}</div>`,total};
}
function calDiaModal(iso){
  const evs=(calEventos()[iso]||[]);
  const d=new Date(iso+'T12:00');
  modal(`<h3 style="text-transform:capitalize">${d.getDate()} de ${MESES_PT[d.getMonth()]}</h3>
    <div class="h-sub">${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][d.getDay()]} · ${evs.length} ${evs.length===1?'item':'itens'}</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:14px">
      ${evs.length?evs.map(e=>calEvHTML(e,false)).join(''):'<div class="empty">Nada marcado neste dia.</div>'}
    </div>
    <div class="modal-actions"><button class="btn line" onclick="closeModal()">Fechar</button>
    <button class="btn" onclick="closeModal();novaPendenciaNoDia('${iso}')">+ Pendência</button></div>`);
}
function vCalendario(){
  const {y,m}=calMonth;
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7;                 // segunda = 0
  const daysInMonth=new Date(y,m+1,0).getDate();
  const abbr=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const evs=calEventos(), hoje=todayISO();
  const MAX=3;                                            // itens visíveis por célula; o resto vira "+N"
  const isoDe=d=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  let cells=abbr.map(a=>`<div class="mc-head">${a}</div>`).join('');
  for(let i=0;i<startOffset;i++)cells+=`<div class="mc-cell mc-empty"></div>`;
  let totalMes=0;
  for(let d=1;d<=daysInMonth;d++){
    const iso=isoDe(d), dia=evs[iso]||[]; totalMes+=dia.length;
    const fds=[5,6].includes((new Date(iso+'T12:00').getDay()+6)%7);
    const vis=dia.slice(0,MAX).map(e=>calEvHTML(e,true)).join('');
    const rest=dia.length-MAX;
    cells+=`<div class="mc-cell mc-click ${iso===hoje?'mc-today':''} ${fds?'mc-wk':''}"
      onclick="novaPendenciaNoDia('${iso}',event)" title="Clique para criar uma pendência em ${fmtBR(iso)}">
      <div class="mc-num">${d}</div>${vis}
      ${rest>0?`<button class="cal-more" onclick="event.stopPropagation();calDiaModal('${iso}')">+${rest} ${rest===1?'item':'itens'}</button>`:''}
    </div>`;
  }

  // Agenda (≤760px): só dias com evento, texto inteiro, sem grade espremida
  const agenda=[];
  for(let d=1;d<=daysInMonth;d++){
    const iso=isoDe(d), dia=evs[iso]||[]; if(!dia.length)continue;
    const wd=['dom','seg','ter','qua','qui','sex','sáb'][new Date(iso+'T12:00').getDay()];
    agenda.push(`<div class="cal-ag-day ${iso===hoje?'hoje':''}">
      <div class="cal-ag-date"><b>${d}</b><span>${wd}</span></div>
      <div class="cal-ag-evs">${dia.map(e=>calEvHTML(e,false)).join('')}</div></div>`);
  }

  const anos=anosCalendario();
  const ano=calAnoHTML(y,evs);
  const navMes=`
      <button class="btn line sm" onclick="calNav(-1)" title="Mês anterior">‹</button>
      <select class="st-select" onchange="calGo(${y},this.value)" style="font-size:14px;padding:7px 10px;text-transform:capitalize">
        ${MESES_PT.map((n,i)=>`<option value="${i}" ${i===m?'selected':''}>${n}</option>`).join('')}
      </select>
      <select class="st-select" onchange="calGo(this.value,${m})" style="font-size:14px;padding:7px 10px">
        ${anos.map(a=>`<option value="${a}" ${a===y?'selected':''}>${a}</option>`).join('')}
      </select>
      <button class="btn line sm" onclick="calNav(1)" title="Próximo mês">›</button>`;
  const navAno=`
      <button class="btn line sm" onclick="calAnoNav(-1)" title="Ano anterior">‹</button>
      <select class="st-select" onchange="calGo(this.value,${m})" style="font-size:14px;padding:7px 10px">
        ${anos.map(a=>`<option value="${a}" ${a===y?'selected':''}>${a}</option>`).join('')}
      </select>
      <button class="btn line sm" onclick="calAnoNav(1)" title="Próximo ano">›</button>`;
  const ehAno=calVista==='ano';

  document.getElementById('view').innerHTML=`
    <div class="page-title">calendário</div>
    <div class="page-sub">Só aparece aqui o que tem data marcada: pendências com prazo, entregáveis da UNITINS e aulas síncronas. Clique num dia vazio para criar uma pendência já com aquela data; clique num evento para abri-lo. A navegação não tem data-limite — 2027, 2028 e seguintes já existem.</div>
    <div class="cal-toolbar">
      <div class="cal-switch">
        <button class="${ehAno?'':'on'}" onclick="setCalVista('mes')">Mês</button>
        <button class="${ehAno?'on':''}" onclick="setCalVista('ano')">Ano</button>
      </div>
      ${ehAno?navAno:navMes}
      <button class="btn line sm" onclick="calHoje()">Hoje</button>
      ${ehAno
        ? `<span class="pill ${ano.total?'purple':'gray'}">${ano.total} ${ano.total===1?'item em':'itens em'} ${y}</span>`
        : `<span class="pill ${totalMes?'purple':'gray'}">${totalMes} ${totalMes===1?'item no mês':'itens no mês'}</span>`}
      <div class="cal-legend">
        <span><i style="background:var(--blue)"></i>Entregável</span>
        <span><i style="background:var(--purple)"></i>Aula síncrona</span>
        <span><i style="background:var(--muted)"></i>Pendência</span>
        <span><i style="background:var(--red)"></i>Atrasado</span>
      </div>
    </div>
    ${ehAno ? ano.html : `
    <div class="cal-grid-wrap"><div class="mcal">${cells}</div></div>
    <div class="cal-agenda card">${agenda.length?agenda.join(''):'<div class="empty">Nada marcado em '+MESES_PT[m]+'.</div>'}</div>`}`;
}
function novaPendenciaNoDia(iso,ev){
  if(ev&&ev.target&&ev.target.closest&&ev.target.closest('.cal-ev,.cal-more'))return; // clique num evento não cria
  mPendencia(); setTimeout(()=>{const d=document.getElementById('pd'); if(d)d.value=iso;},60);
}

function vPendencias(){
  const abertas=store.pendencias.filter(p=>!p.done);
  const feitas=store.pendencias.filter(p=>p.done);
  const urg=abertas.filter(p=>p.prio==='Alta').length;
  const atras=abertas.filter(p=>isAtrasado(p.prazo,p.done)).length;
  const render=p=>{const late=isAtrasado(p.prazo,p.done);
    return `<div class="list-item ${p.done?'done':''}">
    <div class="check ${p.done?'on':''}" onclick="togglePend('${p.id}')">${p.done?'✓':''}</div>
    <div class="li-body"><div class="t">${h(p.nome)}</div>
    <div class="m">${p.area?areaPill(p.area):''} ${p.prio?`<span class="pill ${p.prio==='Alta'?'red':p.prio==='Média'?'amber':'gray'}">${p.prio}</span>`:''} ${p.prazo?`<span class="pill ${late?'red':'gray'}">${late?'⚠ ':''}${fmtBR(p.prazo)}</span>`:''}</div></div>

function togglePend(id){const p=store.pendencias.find(x=>x.id===id);p.done=!p.done;save();vPendencias();}
function delPend(id){store.pendencias=store.pendencias.filter(x=>x.id!==id);save();vPendencias();}
function mPendencia(id=null){const p=id?store.pendencias.find(x=>x.id===id):null;

function savePend(id){const n=document.getElementById('pn').value.trim();if(!n)return;

  else{store.pendencias.push({id:uid(),...dados,done:false});}

/* ---- Diário de Bordo (motor único: página geral + aba do Hub UNITINS) ----
   ctx='geral'   → todas as áreas, com abas de área
   ctx='unitins' → travado na área UNITINS, sem abas (usado dentro do Hub)
   Cada contexto tem seu próprio estado de filtro, então um não interfere no outro. */
const DIARIO_ST={geral:{area:'all',ativ:'',busca:'',ini:'',fim:''},unitins:{area:'unitins',ativ:'',busca:'',ini:'',fim:''}};
function diarioRerender(ctx){ if(ctx==='unitins')vUnitins(); else vDiarios(); }

function diarioPanel(ctx){
  const st=DIARIO_ST[ctx];
  const sel=st.area, busca=st.busca.trim().toLowerCase();

  const porArea=store.logs.filter(l=>(sel==='all'||l.area===sel)
    &&(!st.ini||l.data>=st.ini)&&(!st.fim||l.data<=st.fim));
  // atividades distintas da área selecionada, com contagem e tempo
  const mapa={};
  porArea.forEach(l=>{const a=(l.atividade||'').trim()||'(sem atividade)';
    if(!mapa[a])mapa[a]={n:0,min:0}; mapa[a].n++; mapa[a].min+=durMin(l.ini,l.fim);});
  const ativs=Object.keys(mapa).sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true,sensitivity:'base'}));
  if(st.ativ&&!mapa[st.ativ]) st.ativ='';

  const logs=porArea.filter(l=>{
    const at=(l.atividade||'').trim()||'(sem atividade)';
    if(st.ativ&&at!==st.ativ)return false;
    if(busca){const alvo=(at+' '+(l.obs||'')).toLowerCase();if(!alvo.includes(busca))return false;}
    return true;
  }).sort((a,b)=>(b.data+b.ini).localeCompare(a.data+a.ini));

  const contaFiltro=logs.filter(l=>areaById(l.area).conta);
  const totalFiltro=contaFiltro.reduce((s,l)=>s+durH(l.ini,l.fim),0);
  // sessões de trabalho têm total próprio: antes elas apareciam na lista e somavam zero
  const trabFiltro=logs.filter(l=>!areaById(l.area).conta);
  const totalTrab=trabFiltro.reduce((s,l)=>s+durH(l.ini,l.fim),0);
  const filtrando=!!(st.ativ||busca);
  const areaNova=sel==='all'?'':sel;

  return `
    <div class="card" style="margin-bottom:16px;padding:14px 16px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <div class="field" style="margin:0;flex:1;min-width:200px">
          <label>Atividade</label>
          <select id="dAtiv_${ctx}" onchange="setDiarioAtiv(this.value,'${ctx}')">
            <option value="">Todas as atividades (${porArea.length})</option>
            ${ativs.map(a=>`<option value="${h(a)}" ${a===st.ativ?'selected':''}>${h(a)} — ${mapa[a].n}× · ${fmtDur(mapa[a].min/60)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin:0;flex:1;min-width:180px">
          <label>Buscar em atividade/observações</label>
          <input id="dBusca_${ctx}" placeholder="Ex: derivadas, aula 04" value="${h(st.busca)}" oninput="setDiarioBusca(this.value,'${ctx}')">
        </div>
        ${filtrando?`<button class="btn sm line" onclick="limparFiltroDiario('${ctx}')">Limpar filtros</button>`:''}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
      <span class="pill purple">${logs.length} ${logs.length===1?'sessão':'sessões'}</span>
      ${contaFiltro.length?`<span class="pill green">${fmtDur(totalFiltro)} de estudo no filtro atual</span>`:''}
      ${trabFiltro.length?`<span class="pill gray" title="Trabalho não entra nas horas estudadas — é contabilizado à parte">${fmtDur(totalTrab)} de trabalho (TRE)</span>`:''}
      ${st.ativ?`<span class="pill blue">atividade: ${h(st.ativ)}</span>`:''}
      <button class="btn sm" style="margin-left:auto" onclick="mNovaSessao('${areaNova}')">+ Nova sessão</button>
    </div>
    <div class="card" style="padding:6px 20px">
      ${logs.length?`<div class="table-wrap"><table><thead><tr><th>Data</th>${ctx==='geral'?'<th>Área</th>':''}<th>Atividade</th><th>Observações</th><th>Horário</th><th>Duração</th><th></th></tr></thead>
      <tbody>${logs.map(l=>`<tr>
        <td>${fmtBR(l.data)}</td>${ctx==='geral'?`<td>${areaPill(l.area)}</td>`:''}<td>${h(l.atividade||'—')}</td>
        <td style="color:var(--muted);max-width:220px">${l.obs?h(l.obs):'—'}</td>
        <td>${l.ini}–${l.fim}</td><td><b>${fmtDur(durH(l.ini,l.fim))}</b></td>
        <td style="white-space:nowrap"><button class="icon-btn" onclick="mNovaSessao(null,'${l.id}')" title="Editar">✎</button><button class="icon-btn" onclick="delLog('${l.id}')" title="Excluir">✕</button></td></tr>`).join('')}</tbody></table></div>`
      :`<div class="empty">${filtrando?'Nenhuma sessão com esse filtro.':'Nenhuma sessão registrada ainda.'}</div>`}
    </div>`;
}

function vDiarios(){
  const sel=DIARIO_ST.geral.area;
  const tabs=`<button class="area-tab ${sel==='all'?'active':''}" onclick="setDiario('all')">Todas</button>`+
    AREAS.map(a=>`<button class="area-tab ${sel===a.id?'active':''}" onclick="setDiario('${a.id}')">${a.nome}</button>`).join('');
  document.getElementById('view').innerHTML=`
    <div class="page-title">diários de bordo</div>
    <div class="page-sub">Toda sessão registrada aqui — manualmente, pelo cronômetro ou pelo botão da Grade — alimenta as horas, a aderência semanal e o hábito "Estudo". Lançamentos de TRE têm total próprio, em cinza: contam como carga de trabalho, nunca como estudo.</div>
    <div class="area-tabs">${tabs}</div>
    ${diarioPanel('geral')}`;
}
function setDiario(a){DIARIO_ST.geral.area=a;DIARIO_ST.geral.ativ='';DIARIO_ST.geral.busca='';vDiarios();}
function setDiarioAtiv(v,ctx='geral'){DIARIO_ST[ctx].ativ=v;diarioRerender(ctx);}
function setDiarioBusca(v,ctx='geral'){DIARIO_ST[ctx].busca=v;diarioRerender(ctx);
  const el=document.getElementById('dBusca_'+ctx);
  if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
function limparFiltroDiario(ctx='geral'){DIARIO_ST[ctx].ativ='';DIARIO_ST[ctx].busca='';diarioRerender(ctx);}
function delLog(id){store.logs=store.logs.filter(l=>l.id!==id);save();renderCurrent();}
function recentActivities(area){
  // atividades únicas mais recentes SOMENTE da área selecionada
  const seen=new Set(); const out=[];
  [...store.logs].sort((a,b)=>(b.data+b.ini).localeCompare(a.data+a.ini))
    .filter(l=>l.area===area).forEach(l=>{const a=(l.atividade||'').trim();
      if(a&&!seen.has(a)){seen.add(a);out.push(a);}});
  return out.slice(0,10);
}
function mNovaSessao(areaSel='',editId=null,prefill=null){
  const ed = editId?store.logs.find(l=>l.id===editId):null;
  const areaEff = ed?ed.area:(prefill?prefill.area:(areaSel||'unitins'));
  const rec=recentActivities(areaEff);
  const chips = rec.length ? `<div class="hist-chips" id="histChips">${rec.map(a=>
    `<button type="button" class="chip" onclick="document.getElementById('sat').value=this.textContent">${h(a)}</button>`).join('')}</div>` : '';
  const atividadeVal = ed?(ed.atividade||''):(prefill?(prefill.atividade||''):'');
  const dataVal = ed?ed.data:(prefill?prefill.data:todayISO());
  const iniVal = ed?ed.ini:(prefill?prefill.ini:'');
  const fimVal = ed?ed.fim:(prefill?prefill.fim:'');
  const obsVal = ed?(ed.obs||''):(prefill?(prefill.obs||''):'');
  modal(`<h3>${ed?'Editar sessão':(prefill&&prefill.origem==='timer')?'Salvar sessão do cronômetro':'Nova sessão de estudo'}</h3>
  ${(prefill&&prefill.origem==='timer')?`<div class="pill purple" style="margin-bottom:14px">⏱ Tempo cronometrado: ${fmtDur(durH(iniVal,fimVal))}</div>`:''}
  <div class="field"><label>Área</label><select id="sa" onchange="refreshHistChips(this.value)">${areaOptions(areaEff)}</select></div>
  <div class="field"><label>Atividade</label><input id="sat" placeholder="Ex: Busuu, BBC, Aula 04 de Cálculo" value="${h(atividadeVal)}">
    ${rec.length?`<div style="font-size:11px;color:var(--faint);margin:7px 0 4px" id="histLabel">Últimas atividades desta área (toque para reaproveitar):</div>`:`<div style="font-size:11px;color:var(--faint);margin:7px 0 4px;display:none" id="histLabel">Últimas atividades desta área (toque para reaproveitar):</div>`}${chips||'<div class="hist-chips" id="histChips"></div>'}</div>
  <div class="field"><label>Data</label><input type="date" id="sd" value="${dataVal}"></div>
  <div class="grid2">
    <div class="field"><label>Hora início</label><input type="time" id="si" value="${iniVal}"></div>
    <div class="field"><label>Hora fim</label><input type="time" id="sf" value="${fimVal}"></div>
  </div>
  <div class="field"><label>Observações (opcional)</label><textarea id="so" rows="2">${h(obsVal)}</textarea></div>
  <div class="modal-actions"><button class="btn line" onclick="closeModal()">Cancelar</button>
  <button class="btn" onclick="addLog(${ed?`'${editId}'`:'null'})">${ed?'Salvar':'Salvar sessão'}</button></div>`);}
function refreshHistChips(area){
  const rec=recentActivities(area);const box=document.getElementById('histChips');const lbl=document.getElementById('histLabel');if(!box)return;
  box.innerHTML=rec.map(a=>`<button type="button" class="chip" onclick="document.getElementById('sat').value=this.textContent">${h(a)}</button>`).join('');
  if(lbl)lbl.style.display=rec.length?'block':'none';
}
function addLog(editId=null){const area=document.getElementById('sa').value,ini=document.getElementById('si').value,fim=document.getElementById('sf').value;
  if(!ini||!fim){toast('Preencha início e fim');return;}
  const dados={area,atividade:document.getElementById('sat').value.trim(),
    data:document.getElementById('sd').value,ini,fim,obs:document.getElementById('so').value.trim()};
  if(editId){Object.assign(store.logs.find(l=>l.id===editId),dados);}
  else{store.logs.push({id:uid(),...dados});}
  save();closeModal();
  if(!areaById(area).conta)toast('Sessão salva (TRE não conta como estudo)');else toast(editId?'Sessão atualizada':'Sessão salva');
  renderCurrent();}

let _vgPeriodo=null;
function setVgPeriodo(id){_vgPeriodo=id;vGrade();}
function vGrade(){
  _gaCache=null;
  const pAtv=periodoAtivo();
  if(!_vgPeriodo||!periodoById(_vgPeriodo)) _vgPeriodo=pAtv?pAtv.id:'';
  const pSel=periodoById(_vgPeriodo);
  const ehAtivo=!!(pAtv&&pSel&&pSel.id===pAtv.id);
  const blocosSel=gradeDoPeriodo(_vgPeriodo);
  const st=gradeWeekStats();
  const hoje=todayISO();
  const rColor=st.pctAte>=70?'var(--green)':st.pctAte>=40?'var(--amber)':'var(--rose)';
  const barrasArea=st.areas.length? st.areas.map(a=>{
    const pct=a.plan?Math.min(100,Math.round(a.feito/a.plan*100)):0;
    const ok=a.feito>=a.plan;
    return `<div class="bar-row"><div class="lbl">${areaById(a.id).nome}</div>
      <div class="bar-track"><i style="width:${pct}%;background:${ok?'var(--green)':areaById(a.id).cor}"></i></div>
      <div class="val" style="width:110px">${fmtDur(a.feito/60)}/${fmtDur(a.plan/60)}</div></div>`;}).join('')
    : '<div class="empty" style="padding:14px">Sem blocos de estudo na grade.</div>';
  document.getElementById('view').innerHTML=`
    <div class="page-title">grade semanal</div>
    <div class="page-sub">Sua rotina planejada, <b>versionada por período letivo</b>: a aderência de uma semana passada é sempre comparada com a grade que valia naquela semana. Trocar de semestre não reescreve o histórico. O saldo compensa entre os dias — estudar Espanhol no sábado cobre o bloco de segunda.</div>
    <div class="card" style="margin-bottom:16px;padding:14px 16px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="field" style="margin:0;flex:1;min-width:200px">
          <label>Período letivo</label>
          <select onchange="setVgPeriodo(this.value)">
            ${store.periodos.map(p=>`<option value="${p.id}" ${p.id===_vgPeriodo?'selected':''}>${h(periodoLabel(p))}${p.id===(pAtv&&pAtv.id)?' · vigente':''}</option>`).join('')}
          </select>
        </div>
        <span class="pill ${ehAtivo?'green':'gray'}">${blocosSel.length} blocos</span>
        ${!blocosSel.length&&store.periodos.length>1?`<button class="btn sm line" onclick="mCopiarGrade()">Copiar de outro período</button>`:''}
        <button class="btn sm line" onclick="mPeriodos()">Gerenciar períodos</button>
      </div>
    </div>
    ${!ehAtivo?`<div class="card" style="margin-bottom:16px;border:1px solid var(--line);background:var(--card-2)">
      <div style="font-size:13px;color:var(--muted)">Você está vendo a grade de <b>${h(pSel?pSel.nome:'—')}</b>${periodoEncerrado(pSel)?' (encerrado)':' (ainda não começou)'}. A aderência só é calculada para a semana corrente, então ela não aparece aqui — mas os blocos continuam editáveis, útil para montar o próximo semestre com antecedência.</div>
    </div>`:''}
    ${!ehAtivo?'':`<div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><h3>Aderência da semana</h3><div class="h-sub" style="margin-bottom:0">Tempo estudado ÷ planejado, por área, na semana inteira (Seg–Dom) · TRE fora</div></div>
        <span style="font-family:var(--serif);font-size:30px;font-weight:600;color:var(--purple)">${st.pct}%</span>
      </div>
      <div class="progress" style="height:10px"><i style="width:${st.pct}%;background:linear-gradient(90deg,var(--purple),var(--rose))"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px">
        <div class="h-sub" style="margin:0">${fmtDur(st.feitoCap/60)} de ${fmtDur(st.plan/60)} planejadas · ${st.blocosDone}/${st.blocosTotal} blocos cobertos${st.blocosAdiant?` (${st.blocosAdiant} adiantados)`:''}${st.excedente>0?` · <span style="color:var(--green)">+${fmtDur(st.excedente/60)} além do plano</span>`:''}</div>
        <span class="pill" style="background:${rColor}22;color:${rColor}">No ritmo até hoje: ${st.pctAte}%</span>
      </div>
      <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
        <div class="h-sub" style="margin-bottom:10px">Por área — estudado vs. planejado nesta semana</div>
        <div class="bars">${barrasArea}</div>
      </div>
    </div>`}
    <div style="display:flex;margin-bottom:16px"><button class="btn sm" style="margin-left:auto" onclick="mBloco()">+ Novo bloco</button></div>
    ${DIAS.map(d=>{const blocos=blocosSel.filter(g=>g.dia===d).sort((a,b)=>gradeStartMin(a.horario)-gradeStartMin(b.horario));
      const di=DIAS.indexOf(d); const mon=anMonday(0); const dd=new Date(mon); dd.setDate(dd.getDate()+di); const dISO=localISO(dd);
      const isHoje=dISO===hoje, isPast=dISO<hoje;
      const alloc=dayAlloc(dISO);
      return `<div class="card" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3>${d} ${isHoje?'<span class="pill purple" style="font-size:10px">hoje</span>':''}</h3>
          <button class="btn sm line" onclick="mBloco(null,'${d}')">+ Adicionar em ${d}</button></div>
        ${blocos.length?blocos.map(g=>{const conta=areaById(g.area).conta;const a=alloc[g.id];
          let acao='<span class="pill gray">não conta</span>';
          if(conta){
            if(a&&a.done) acao=a.adiantado
              ?`<span class="pill blue" title="Coberto pelo saldo da semana antes do dia chegar">✓ adiantado</span>`
              :`<span class="pill green" title="${fmtDur(a.alloc/60)} do saldo da área alocados neste bloco">✓ feito</span>`;
            else if(a&&a.alloc>0) acao=`<span class="pill amber" title="Cobertura parcial desta área neste dia">${Math.round(a.alloc/a.need*100)}% · ${fmtDur(a.alloc/60)}</span>`
              +((isHoje||isPast)?` <button class="btn sm line" onclick="cumprirBloco('${g.id}','${dISO}')" title="Completar lançando o bloco cheio">Registrar</button>`:'');
            else if(isHoje) acao=`<button class="btn sm line" onclick="cumprirBloco('${g.id}','${dISO}')">Registrar hoje</button>`;
            else if(isPast) acao=`<button class="btn sm line" onclick="cumprirBloco('${g.id}','${dISO}')" title="Registrar em ${fmtBR(dISO)}">Registrar (${fmtBR(dISO).slice(0,5)})</button>`;
            else acao='<span class="pill gray">a fazer</span>';
          }
          return `<div class="list-item">
          <span class="tag-dot" style="background:${areaById(g.area).cor}"></span>
          <div class="li-body"><div class="t">${h(g.atividade)}</div><div class="m">${h(g.horario)} · ${areaById(g.area).nome}${a?` · ${fmtDur(a.need/60)} planejados`:''}</div></div>
          ${acao}
          <button class="icon-btn" onclick="mBloco('${g.id}')" title="Editar">✎</button>
          <button class="icon-btn" onclick="delBloco('${g.id}')" title="Excluir">✕</button>
        </div>`;}).join(''):'<div class="empty" style="padding:16px">Sem blocos neste dia.</div>'}
      </div>`;}).join('')}
    <div class="h-sub">O saldo de cada área na semana paga os blocos em ordem cronológica: primeiro os de dias passados e de hoje, depois os futuros (marcados <span class="pill blue" style="font-size:10px">✓ adiantado</span>). Um bloco fecha com <b>80%</b> da duração planejada coberta.</div>`;
}
function gradeStartMin(hor){const m=String(hor).match(/(\d{1,2})h(\d{0,2})/);if(!m)return 9999;return parseInt(m[1])*60+(m[2]?parseInt(m[2]):0);}
function parseGradeTime(hor){
  const m=String(hor).match(/(\d{1,2})h(\d{0,2})\s*[-–]\s*(\d{1,2})h(\d{0,2})/);
  if(!m)return null;
  const p=(hh,mm)=>String(hh).padStart(2,'0')+':'+String(mm||'00').padStart(2,'0');
  return {ini:p(m[1],m[2]), fim:p(m[3],m[4])};
}
function gradeBlockMin(g){const t=parseGradeTime(g.horario);return t?durMin(t.ini,t.fim):60;}

/* Alocação semanal: os minutos registrados na semana viram um "saldo" por área e
   pagam os blocos daquela área na ordem cronológica da semana — dia nenhum fica preso
   ao seu próprio registro. Blocos passados/hoje são pagos primeiro; a sobra adianta os futuros. */
let _gaCache=null;
/* A grade é versionada por período: a aderência de uma semana antiga precisa ser
   comparada com a grade que valia NAQUELA semana, não com a grade de hoje. */
function gradeDoPeriodo(pid){return store.grade.filter(g=>g.periodo===pid);}
function gradeDaSemana(monISO){
  const p=periodoDe(monISO)||periodoDe(addDaysISO(monISO,6))||periodoAtivo();
  return p?gradeDoPeriodo(p.id):[];
}
function weekAlloc(){
  if(_gaCache)return _gaCache;
  const mon=anMonday(0), hoje=todayISO();
  const dias=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);dias.push(localISO(d));}
  const pool={};
  countableLogs().forEach(l=>{if(l.data<dias[0]||l.data>dias[6])return;
    pool[l.area]=(pool[l.area]||0)+durMin(l.ini,l.fim);});
  const blocos=gradeDaSemana(localISO(mon)).filter(g=>areaById(g.area).conta&&DIAS.indexOf(g.dia)>=0)
    .map(g=>({g,di:DIAS.indexOf(g.dia),iso:dias[DIAS.indexOf(g.dia)],ini:gradeStartMin(g.horario)}));
  const cmp=(a,b)=>(a.di-b.di)||(a.ini-b.ini);
  const ordem=[...blocos.filter(b=>b.iso<=hoje).sort(cmp),...blocos.filter(b=>b.iso>hoje).sort(cmp)];
  const res={};
  ordem.forEach(b=>{
    const need=gradeBlockMin(b.g)||1, have=pool[b.g.area]||0, al=Math.min(need,have);
    pool[b.g.area]=have-al;
    res[b.g.id]={need,alloc:al,done:al>=need*0.8,adiantado:b.iso>hoje&&al>=need*0.8,iso:b.iso};
  });
  _gaCache={res,sobra:pool};
  return _gaCache;
}
function dayAlloc(iso){
  const all=weekAlloc().res, out={};
  Object.keys(all).forEach(k=>{if(all[k].iso===iso)out[k]=all[k];});
  return out;
}
function gradeFulfilledOn(g,iso){const a=dayAlloc(iso)[g.id];return !!(a&&a.done);}
function gradeWeekStats(){
  _gaCache=null;
  const mon=anMonday(0), hoje=todayISO();
  const dias=[];for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);dias.push(localISO(d));}
  const plan={},planAte={},feito={},feitoAte={};
  gradeDaSemana(dias[0]).forEach(g=>{
    if(!areaById(g.area).conta)return;
    const di=DIAS.indexOf(g.dia); if(di<0)return;
    const m=gradeBlockMin(g);
    plan[g.area]=(plan[g.area]||0)+m;
    if(dias[di]<=hoje) planAte[g.area]=(planAte[g.area]||0)+m;
  });
  countableLogs().forEach(l=>{
    if(l.data<dias[0]||l.data>dias[6])return;
    const m=durMin(l.ini,l.fim);
    feito[l.area]=(feito[l.area]||0)+m;
    if(l.data<=hoje) feitoAte[l.area]=(feitoAte[l.area]||0)+m;
  });
  const areas=Object.keys(plan).map(id=>({id,plan:plan[id],feito:feito[id]||0}))
    .sort((a,b)=>b.plan-a.plan);
  const somaPlan=areas.reduce((s,a)=>s+a.plan,0);
  const cap=areas.reduce((s,a)=>s+Math.min(a.plan,a.feito),0);
  const feitoTotal=areas.reduce((s,a)=>s+a.feito,0);
  const somaPlanAte=Object.values(planAte).reduce((s,v)=>s+v,0);
  const capAte=Object.keys(planAte).reduce((s,id)=>s+Math.min(planAte[id],feitoAte[id]||0),0);
  const wa=weekAlloc().res;
  const chaves=Object.keys(wa);
  const blocosTotal=chaves.length;
  const blocosDone=chaves.filter(k=>wa[k].done).length;
  const blocosAdiant=chaves.filter(k=>wa[k].adiantado).length;
  return {areas,plan:somaPlan,feitoCap:cap,excedente:Math.max(0,feitoTotal-cap),
    pct: somaPlan?Math.round(cap/somaPlan*100):0,
    pctAte: somaPlanAte?Math.round(capAte/somaPlanAte*100):0,
    blocosDone,blocosTotal,blocosAdiant};
}
function cumprirBloco(id,iso){
  const g=store.grade.find(x=>x.id===id); if(!g)return;
  iso=iso||todayISO();
  if(iso>todayISO()){toast('Esse dia ainda não chegou');return;}
  _gaCache=null;
  if(gradeFulfilledOn(g,iso)){toast('Este bloco já está coberto pelo Diário desse dia');return;}
  const t=parseGradeTime(g.horario);
  if(!t){ regFromGrade(id); return; }
  store.logs.push({id:uid(),area:g.area,atividade:g.atividade,data:iso,ini:t.ini,fim:t.fim,obs:''});
  save(); _gaCache=null; vGrade();
  toast('✓ Registrado em '+fmtBR(iso)+' ('+fmtDur(durH(t.ini,t.fim))+')');
}
function regFromGrade(id){

}
